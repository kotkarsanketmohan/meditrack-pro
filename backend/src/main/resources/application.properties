spring.application.name=meditrack-pro
server.port=${PORT:8080}

# Load environment variables if present (.env)
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meditrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


jwt.secret=${JWT_SECRET:meditrack_pro_local_development_secret_key_2026_do_not_share}
jwt.expiration=86400000

brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=${BREVO_API_KEY}
brevo.sender.name=${BREVO_SENDER_NAME:MediTrack Pro}
brevo.sender.email=${BREVO_SENDER_EMAIL:meditrackpro01@gmail.com}
app.email.enabled=true

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend.url=${APP_BACKEND_URL:http://localhost:8080}

cors.allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.springframework.web=WARN
logging.level.com.meditrack=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n